name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate configuration
        # Ensures models.yaml is valid YAML and has required sections
        run: python -c "
from app.core.config import _load_models_yaml, ModelConfig
data = _load_models_yaml()
cfg = ModelConfig(data)
print('config_version:', cfg.config_version)
print('llm_model:', cfg.llm_model)
print('embedding_model:', cfg.embedding_model)
print('embedding_dimensionality:', cfg.embedding_dimensionality)
print('OK')
"

      - name: Run tests
        # Tests that don't require live services (MongoDB, Qdrant, Gemini)
        run: pytest tests/test_config.py -v --no-header
        env:
          # Dummy values for tests that check settings validation
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-minimum-32-chars-long-padding' }}
          GEMINI_API_KEY: test-key
          MONGODB_URI: mongodb://localhost:27017
          QDRANT_URL: http://localhost:6333

  backend-config-validate:
    name: Backend — Config Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML only
        run: pip install pyyaml

      - name: Validate models.yaml schema
        run: python -c "
import yaml, sys
with open('config/models.yaml') as f:
    data = yaml.safe_load(f)
required = ['llm', 'embedding', 'verification', 'reranker', 'retrieval', 'reliability', 'recovery', 'cost_controls', 'runtime']
missing = [k for k in required if k not in data]
if missing:
    print('FAIL: Missing sections:', missing)
    sys.exit(1)
# Check no secrets
content = open('config/models.yaml').read()
forbidden = ['api_key', 'password', 'secret', 'mongodb+srv', 'AIza']
for f in forbidden:
    if f in content:
        print(f'FAIL: Potential secret found: {f}')
        sys.exit(1)
print('models.yaml validation passed')
"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ── Gate ──────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs:
      - backend-lint
      - backend-test
      - backend-config-validate
      - frontend-lint
      - frontend-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
