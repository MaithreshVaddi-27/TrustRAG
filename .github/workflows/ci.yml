name: CI

on:
  push:
    branches: [main, develop, ui-redesign]
  pull_request:
    branches: [main, develop, ui-redesign]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate configuration
        # Ensures models.yaml is valid YAML and has required sections
        run: |
          python -c "
          from app.core.config import _load_models_yaml, ModelConfig
          data = _load_models_yaml()
          cfg = ModelConfig(data)
          print('config_version:', cfg.config_version)
          print('llm_model:', cfg.llm_model)
          print('embedding_model:', cfg.embedding_model)
          print('embedding_dimensionality:', cfg.embedding_dimensionality)
          print('OK')
          "

      - name: Run tests
        # Tests use mocking/monkeypatch — no live services required
        run: pytest tests/ -v --no-header
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-minimum-32-chars-long-padding' }}
          GEMINI_API_KEY: test-key
          MONGODB_URI: mongodb://localhost:27017
          QDRANT_URL: http://localhost:6333

  backend-config-validate:
    name: Backend — Config Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML only
        run: pip install pyyaml

      - name: Validate models.yaml schema
        run: |
          python -c "
          import yaml, sys
          with open('config/models.yaml') as f:
              data = yaml.safe_load(f)
          required = ['llm', 'embedding', 'verification', 'reranker', 'retrieval', 'reliability', 'recovery', 'cost_controls', 'runtime']
          missing = [k for k in required if k not in data]
          if missing:
              print('FAIL: Missing sections:', missing)
              sys.exit(1)
          # Check no secrets
          content = open('config/models.yaml').read()
          forbidden = ['api_key', 'password', 'secret', 'mongodb+srv', 'AIza']
          for f in forbidden:
              if f in content:
                  print('FAIL: Potential secret found:', f)
                  sys.exit(1)
          print('models.yaml validation passed')
          "

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm run test

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ── E2E + Load (Playwright + k6) ───────────────────────────────────────────
  e2e:
    name: E2E + Load — Playwright & k6
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Start backend API
        working-directory: apps/api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-minimum-32-chars-long-padding' }}
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: trustrag_e2e
          QDRANT_URL: local
          APP_ENV: development
          CORS_ORIGINS: http://localhost:5173
          AI_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          EMBEDDING_PROVIDER: google_genai
          GEMINI_API_KEY: test-key
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/v1/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start:"; tail -50 /tmp/api.log; exit 1

      - name: Install frontend deps + Playwright browser
        working-directory: apps/web
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: apps/web
        env:
          E2E_API_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Run k6 API load smoke
        # TEST-M2: reuse the already-running backend from the E2E job.
        # Pinned k6 release binary — full 35s ramp, ~3.3k requests.
        working-directory: load-test
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz | tar xz --strip-components=1
          ./k6 run smoke.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build API Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (runtime stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: trustrag-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: trustrag-api:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ── Gate ──────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs:
      - backend-lint
      - backend-test
      - backend-config-validate
      - frontend-lint
      - frontend-build
      - e2e
      - docker-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
