name: CI

on:
  push:
    branches: [main, develop, ui-redesign]
  pull_request:
    branches: [main, develop, ui-redesign]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff and mypy
        # Pinned: unpinned `ruff` broke CI when 0.16.9 added E402 coverage
        # (conftest import order). Bump deliberately with a lint pass.
        run: pip install "ruff==0.16.9" mypy

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

      - name: Type check (mypy ratchet)
        # N-94: mypy was configured but never run, so its 48-error backlog was
        # invisible. Fails only on NEW errors (ceiling ratchets down over time).
        working-directory: ./
        run: ./scripts/typecheck_ratchet.sh

      - name: Port registry drift check
        run: python3 ../../scripts/apply_ports.py --check

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate configuration
        # Ensures models.yaml is valid YAML and has required sections
        run: |
          python -c "
          from app.core.config import _load_models_yaml, ModelConfig
          data = _load_models_yaml()
          cfg = ModelConfig(data)
          print('config_version:', cfg.config_version)
          print('llm_model:', cfg.llm_model)
          print('embedding_model:', cfg.embedding_model)
          print('embedding_dimensionality:', cfg.embedding_dimensionality)
          print('OK')
          "

      - name: Run tests
        # Tests use mocking/monkeypatch — no live services required
        run: pytest tests/ -v --no-header
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-minimum-32-chars-long-padding' }}
          GEMINI_API_KEY: test-key
          MONGODB_URI: mongodb://localhost:27017
          QDRANT_URL: http://localhost:6333

  backend-config-validate:
    name: Backend — Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML only
        run: pip install pyyaml

      - name: Validate models.yaml schema
        run: |
          python -c "
          import yaml, sys
          with open('config/models.yaml') as f:
              data = yaml.safe_load(f)
          required = ['llm', 'embedding', 'verification', 'reranker', 'retrieval', 'reliability', 'recovery', 'cost_controls', 'runtime']
          missing = [k for k in required if k not in data]
          if missing:
              print('FAIL: Missing sections:', missing)
              sys.exit(1)
          # Check no secrets
          content = open('config/models.yaml').read()
          forbidden = ['api_key', 'API_KEY', 'password', 'secret', 'mongodb+srv', 'AIza', 'sk-']
          for f in forbidden:
              if f in content:
                  print('FAIL: Potential secret found:', f)
                  sys.exit(1)
          print('models.yaml validation passed')
          "

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm run test

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ── Cross-Platform Smoke (Windows + macOS) ─────────────────────────────────
  # Ubuntu is covered by the jobs above. This job proves the torch-free runtime
  # installs and boots on Windows and macOS: backend imports + config validation
  # (catches POSIX-only paths, missing wheels) and frontend lint/test/build
  # (catches case-sensitivity and Node-version drift — engines requires >= 22).
  cross-platform:
    name: Cross-Platform Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend (main deps only)
        run: pip install -e .
        working-directory: apps/api

      - name: Backend import + config smoke
        run: |
          python -c "import app.rag.ingestion.parser, app.rag.ingestion.chunker, app.rag.ingestion.chunking_strategies, app.rag.ingestion.pipeline, app.llm.model_registry, app.core.system.hardware, app.core.system.memory; print('imports OK')"
          python ../../scripts/apply_ports.py --check
        env:
          JWT_SECRET: test-secret-minimum-32-chars-long-padding
          GEMINI_API_KEY: test-key
          MONGODB_URI: mongodb://localhost:27017
          QDRANT_URL: http://localhost:6333

      - name: Install frontend
        run: npm ci
        working-directory: apps/web

      - name: Frontend lint + tests + build
        run: |
          npm run lint
          npm test
          npm run build
        working-directory: apps/web

  # ── E2E + Load (Playwright + k6) ───────────────────────────────────────────
  e2e:
    name: E2E + Load — Playwright & k6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Start backend API
        working-directory: apps/api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-minimum-32-chars-long-padding' }}
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: trustrag_e2e
          QDRANT_URL: local
          APP_ENV: development
          CORS_ORIGINS: http://localhost:5173
          AI_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start:"; tail -50 /tmp/api.log; exit 1

      - name: Install frontend deps + Playwright browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: apps/web
        env:
          E2E_API_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Download k6 (checksum-verified)
        # N-97: curl|tar with no checksum is an unauthenticated supply-chain
        # hop. Verify SHA256 against the release checksum file before extracting.
        id: k6
        working-directory: load-test
        run: |
          set -euo pipefail
          VER=v2.2.0
          BASE=https://github.com/grafana/k6/releases/download/${VER}
          curl -sSfL -o k6.tar.gz "${BASE}/k6-${VER}-linux-amd64.tar.gz"
          curl -sSfL -o checksums.txt "${BASE}/k6-${VER}-checksums.txt"
          grep "k6-${VER}-linux-amd64.tar.gz" checksums.txt | sha256sum --check --strict -
          tar xz k6.tar.gz --strip-components=1
          ./k6 version

      - name: Run k6 API load smoke
        # TEST-M2: reuse the already-running backend from the E2E job.
        working-directory: load-test
        env:
          API_BASE_URL: http://localhost:8000
        run: ./k6 run smoke.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build API Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # security-events:write is required by the SARIF upload step below.
    permissions:
      contents: read
      actions: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (runtime stage)
        # NOTE: defaults.run.working-directory does NOT apply to `uses:` steps —
        # context/file must be repo-root-relative.
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: runtime
          load: true
          tags: trustrag-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        # Advisory (exit-code 0): HIGH/CRITICAL findings in the Debian slim base
        # would otherwise keep this job permanently red. Findings surface as
        # Security-tab alerts (SARIF upload) instead of a hard gate — the
        # blocking security signal stays in the Security workflow
        # (pip-audit --strict, npm audit, Bandit).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trustrag-api:test
          format: sarif
          output: apps/api/trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/api/trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: apps/api/trivy-results.sarif
          retention-days: 30

  # ── Docker Compose Smoke ──────────────────────────────────────────────────
  # N-103: compose is the only deployable artifact and nothing exercised it,
  # so P1-16 (model cache shadow), N-64 (unreachable MLX) and N-100 (--reload
  # killing in-flight analyses) all shipped undetected. This renders the file
  # and boots the api service against the same config operators run.
  compose-smoke:
    name: Docker — Compose Config + API Boot
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build api

      - name: Boot api + qdrant and probe readiness
        run: |
          set -euo pipefail
          mkdir -p apps/api/.model_cache
          docker compose up -d qdrant api
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/api/v1/health/ready > /dev/null 2>&1; then
              echo "api ready after ${i}s"
              docker compose logs --tail=60 api
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=120 api
          docker compose down
          echo "api never became ready"
          exit 1

  # ── Gate ──────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    timeout-minutes: 5
    needs:
      - backend-lint
      - backend-test
      - backend-config-validate
      - frontend-lint
      - frontend-build
      - cross-platform
      - e2e
      - docker-build
      - compose-smoke
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" || "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "CI FAILED — one or more jobs failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "CI PASSED"
