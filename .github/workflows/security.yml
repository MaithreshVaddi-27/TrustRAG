name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly scan for new CVEs even without code changes
  schedule:
    - cron: "0 6 * * 1"
  # Enable manual runs of this workflow
  workflow_dispatch:

jobs:
  # ── Python dependency audit ────────────────────────────────────────────────
  python-audit:
    name: Python — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install .[dev]

      - name: Audit Python dependencies
        run: |
          pip-audit --strict --format json --output pip-audit-report.json || true
          pip-audit --strict

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: apps/api/pip-audit-report.json
          retention-days: 30

  # ── Node/NPM audit ────────────────────────────────────────────────────────
  npm-audit:
    name: Frontend — NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Audit NPM dependencies
        run: npm audit --audit-level=high

  # ── Secret scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          if find . -name ".env" -not -name ".env.example" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: .env file found in repository!"
            find . -name ".env" -not -name ".env.example" -not -path "./.git/*"
            exit 1
          fi
          echo "No .env files committed — OK"

      - name: Check .gitignore covers .env
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo "ERROR: .env is not in .gitignore root"
            exit 1
          fi
          echo ".gitignore covers .env — OK"

      - name: Check models.yaml for secrets
        run: |
          python3 -c "
          content = open('apps/api/config/models.yaml').read()
          patterns = ['api_key', 'API_KEY', 'password', 'secret', 'mongodb+srv', 'AIza', 'sk-']
          found = [p for p in patterns if p in content]
          if found:
              print('FAIL: Possible secrets in models.yaml:', found)
              import sys; sys.exit(1)
          print('models.yaml clean — OK')
          "

  # ── SAST (static analysis) ────────────────────────────────────────────────
  sast:
    name: Python — SAST (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r app/ -ll -ii --skip B104 -f json -o bandit-report.json || bandit -r app/ -ll -ii --skip B104

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: apps/api/bandit-report.json
          retention-days: 30
