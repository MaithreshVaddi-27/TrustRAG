<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TrustRAG — Landing Page (Desktop 1440×900)</title>
  <desc id="desc">Genuine designed mockup: TrustRAG premium landing hero — obsidian, chrome silver, laser crimson dark-only, ambient flares, crimson CTA edge, mono stat cards, pipeline preview.</desc>
  <defs>
    <radialGradient id="spot" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d41514" stop-opacity="0.10"/>
      <stop offset="80%" stop-color="#d41514" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0403f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f0403f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8a8a8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a8a8a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <style>
      .bg { fill:url(#grad); }
      .hairline { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .serif { font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
      .sans { font-family:Inter, system-ui, sans-serif; }
      .mono { font-family:'JetBrains Mono', monospace; }
      .nav-text { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:14; font-weight:600; letter-spacing:-0.01em; }
      .hero-main { fill:#cdcbc8; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-size:62; font-weight:800; letter-spacing:-0.025em; }
      .hero-sub { fill:#a8a8a8; font-family:Inter,sans-serif; font-size:18; line-height:1.65; }
      .kicker { fill:#d41514; font-family:'JetBrains Mono',monospace; font-size:11; letter-spacing:0.05em; font-weight:700; }
      .stat-val { fill:#cdcbc8; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-size:34; font-weight:700; letter-spacing:-0.02em; }
      .stat-lbl { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:10.5; letter-spacing:0.04em; }
      .btn { rx:14; cursor:pointer; }
      .btn-text { fill:#080808; font-family:Inter,sans-serif; font-size:16; font-weight:700; }
      .card { fill:#121212; rx:20; stroke:#1a1a1a; stroke-width:1; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <!-- Ambient flares -->
  <circle cx="720" cy="-140" r="340" fill="#f0403f" opacity="0.06"/>
  <circle cx="1340" cy="260" r="260" fill="#d41514" opacity="0.05"/>
  <circle cx="100" cy="740" r="300" fill="#a8a8a8" opacity="0.03"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1440" height="80" fill="#080808/0.7"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <g transform="translate(40, 28)">
    <rect x="0" y="-10" width="36" height="36" rx="10" fill="#121212" stroke="#d41514" stroke-width="1.5"/>
    <text x="18" y="14" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="20" font-weight="800">T</text>
    <text x="52" y="16" class="serif" fill="#cdcbc8" font-size="17" font-weight="700" letter-spacing="-0.02em">TrustRAG</text>
  </g>
  <g transform="translate(960, 28)">
    <text x="0" y="16" class="nav-text">Product</text>
    <text x="80" y="16" class="nav-text">Benchmarks</text>
    <text x="150" y="16" class="nav-text">Docs</text>
    <rect x="230" y="-10" width="120" height="46" rx="12" class="btn" fill="#d41514"/>
    <text x="290" y="12" text-anchor="middle" class="btn-text" font-size="14" fill="#080808">Get started</text>
  </g>

  <!-- Hero -->
  <g transform="translate(40, 200)">
    <text x="0" y="14" class="kicker">AI RELIABILITY &amp; HALLUCINATION AUDIT</text>
    <text x="0" y="94" class="hero-main">Every claim,<br/>verified end to end.</text>
    <text x="0" y="160" class="hero-sub" max-width="560">TrustRAG decomposes claims, retrieves sparse + dense evidence, and returns a verified, contradicted, or unsupported verdict — with full traceability and zero fabricated metrics.</text>
    <rect x="0" y="192" width="1" height="32" stroke="#d41514" stroke-width="2" opacity="0.7"/>
    <rect x="0" y="246" width="210" height="56" rx="14" class="btn" fill="#d41514"/>
    <text x="105" y="276" text-anchor="middle" class="btn-text">Start a free audit</text>
    <rect x="230" y="246" width="180" height="56" rx="14" class="btn" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="320" y="276" text-anchor="middle" class="btn-text" fill="#a8a8a8">View benchmarks</text>
    <text x="0" y="310" class="mono" fill="#4d4d4d" font-size="11" letter-spacing="0.04em">SOC 2 · GDPR · on-prem · air-gapped</text>
  </g>

  <!-- Hero visual panel (right) -->
  <g transform="translate(760, 200)">
    <rect x="0" y="0" width="640" height="460" rx="24" class="card"/>
    <rect x="0" y="0" width="640" height="1" fill="#d41514" opacity="0.35"/>
    <text x="32" y="38" class="serif" fill="#cdcbc8" font-size="19" font-weight="600">Live pipeline preview</text>
    <text x="32" y="62" class="mono" fill="#737373" font-size="11">Claim → decompose → retrieve → verify → verdict</text>
    <g transform="translate(32, 94)">
      <rect x="0" y="0" width="120" height="40" rx="6" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
      <text x="16" y="26" class="mono" fill="#a8a8a8" font-size="10">claim ingest</text>
      <line x1="134" y1="20" x2="166" y2="20" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="172" y="0" width="120" height="40" rx="6" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
      <text x="188" y="26" class="mono" fill="#a8a8a8" font-size="10">decompose</text>
      <line x1="306" y1="20" x2="338" y2="20" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="344" y="0" width="120" height="40" rx="6" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
      <text x="360" y="26" class="mono" fill="#a8a8a8" font-size="10">retrieve</text>
      <line x1="478" y1="20" x2="510" y2="20" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="516" y="0" width="120" height="40" rx="6" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
      <text x="532" y="26" class="mono" fill="#a8a8a8" font-size="10">verify</text>
      <line x1="650" y1="20" x2="682" y2="20" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="688" y="0" width="120" height="40" rx="6" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
      <text x="704" y="26" class="mono" fill="#a8a8a8" font-size="10">verdict</text>
    </g>
    <rect x="32" y="164" width="576" height="260" rx="16" fill="#080808" stroke="#1a1a1a" stroke-width="1"/>
    <text x="52" y="292" class="serif" fill="#cdcbc8" font-size="30" font-weight="700">94%</text>
    <text x="52" y="322" class="mono" fill="#737373" font-size="10.5">claims routed to correct verdict in benchmarks</text>
  </g>

  <!-- Stat band -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="1360" height="130" rx="18" class="surface"/>
    <rect x="0" y="0" width="1" height="130" fill="#d41514" opacity="0.35"/>
    <text x="32" y="44" class="stat-val">14k+</text>
    <text x="32" y="78" class="stat-lbl">claims audited</text>
    <text x="320" y="44" class="stat-val">99.2%</text>
    <text x="320" y="78" class="stat-lbl">verdict accuracy</text>
    <text x="640" y="44" class="stat-val">2.3s</text>
    <text x="640" y="78" class="stat-lbl">median latency</text>
    <text x="960" y="44" class="stat-val">0</text>
    <text x="960" y="78" class="stat-lbl">fabricated metrics</text>
    <text x="1240" y="44" class="stat-val" fill="#a8a8a8">air-gapped</text>
    <text x="1240" y="78" class="stat-lbl">deployment ready</text>
  </g>

  <text x="40" y="876" class="mono" fill="#4d4d4d" font-size="10.5" letter-spacing="0.04em">TrustRAG · The Ledger v3 · Desktop 1440×900 · Dark-only · Visual deliverable only · No source modified</text>
</svg>
