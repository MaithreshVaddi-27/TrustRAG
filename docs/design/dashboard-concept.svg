<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TrustRAG — Dashboard Concept</title>
  <desc id="desc">Genuine designed mockup: TrustRAG dashboard — obsidian shell, chrome silver data, laser crimson accent, claims table, AI verdict stream, confidence sparkline, dark-only.</desc>
  <defs>
    <linearGradient id="dbCrimson" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#d41514"/>
      <stop offset="100%" stop-color="#f0403f"/>
    </linearGradient>
    <filter id="dbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill:#080808; }
      .hairline { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .serif { font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
      .sans { font-family:Inter, system-ui, sans-serif; }
      .mono { font-family:'JetBrains Mono', monospace; }
      .app-title { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:20; font-weight:700; letter-spacing:-0.01em; }
      .app-sub { fill:#737373; font-family:Inter,sans-serif; font-size:12; }
      .section { fill:#d41514; font-family:Inter,sans-serif; font-size:12; font-weight:600; letter-spacing:0.02em; }
      .label { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:10; letter-spacing:0.04em; }
      .stat-val { fill:#cdcbc8; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-size:26; font-weight:700; letter-spacing:-0.02em; }
      .stat-lbl { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:9.5; letter-spacing:0.04em; }
      .row-text { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:13; }
      .row-muted { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:11; }
      .btn { rx:8; cursor:pointer; }
      .btn-text { fill:#080808; font-family:Inter,sans-serif; font-size:13; font-weight:700; }
      .badge { rx:999; }
      .cell { fill:none; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>

  <!-- App shell: sidebar -->
  <rect x="0" y="0" width="260" height="900" fill="#121212"/>
  <line x1="260" y1="0" x2="260" y2="900" stroke="#1a1a1a" stroke-width="1"/>
  <g transform="translate(24, 40)">
    <rect x="0" y="-10" width="34" height="34" rx="10" fill="#1a1a1a" stroke="#d41514" stroke-width="1.5"/>
    <text x="17" y="12" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="19" font-weight="800">T</text>
    <text x="44" y="14" class="app-title">TrustRAG</text>
    <text x="44" y="30" class="app-sub">The Ledger v3 · Dark</text>
  </g>
  <g transform="translate(24, 100)">
    <text x="0" y="16" class="section">WORKSPACE</text>
    <rect x="0" y="24" width="212" height="44" rx="10" class="surface" fill="#1a1a1a" stroke="#d41514" stroke-width="1.5"/>
    <text x="14" y="48" class="mono" fill="#d41514" font-size="12" font-weight="600">▸ Workbench</text>
    <rect x="0" y="78" width="212" height="44" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="102" class="mono" fill="#a8a8a8" font-size="12">Evidence</text>
    <rect x="0" y="132" width="212" height="44" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="156" class="mono" fill="#a8a8a8" font-size="12">Claims</text>
    <rect x="0" y="186" width="212" height="44" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="210" class="mono" fill="#a8a8a8" font-size="12">Conflicts</text>
    <rect x="0" y="240" width="212" height="44" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="264" class="mono" fill="#a8a8a8" font-size="12">Settings</text>
    <text x="0" y="300" class="label">Sidebar · 260px · 44px nav rows · aria-expanded</text>
  </g>

  <!-- Main header -->
  <rect x="260" y="0" width="1180" height="80" fill="#080808/0.6"/>
  <line x1="260" y1="80" x2="1440" y2="80" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <g transform="translate(300, 26)">
    <text x="0" y="0" class="serif" fill="#cdcbc8" font-size="28" font-weight="700" letter-spacing="-0.02em">Workbench</text>
    <text x="0" y="24" class="app-sub">14 claims · 2 contradicted · last audited 14m ago</text>
  </g>
  <g transform="translate(1060, 22)">
    <rect x="0" y="-10" width="34" height="34" rx="8" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
    <rect x="40" y="-10" width="96" height="34" rx="8" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="88" y="10" text-anchor="middle" class="mono" fill="#737373" font-size="11">maithresh</text>
  </g>

  <!-- Stat row -->
  <g transform="translate(300, 124)">
    <rect x="0" y="0" width="250" height="110" rx="14" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="0" y="0" width="250" height="1" fill="#d41514" opacity="0.35"/>
    <text x="24" y="34" class="stat-val">14</text>
    <text x="24" y="58" class="stat-lbl">claims audited today</text>
    <rect x="274" y="0" width="250" height="110" rx="14" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="274" y="0" width="250" height="1" fill="#22c55e" opacity="0.35"/>
    <text x="298" y="34" class="stat-val" fill="#22c55e">94%</text>
    <text x="298" y="58" class="stat-lbl" fill="#4ade80">verdict accuracy</text>
    <rect x="548" y="0" width="250" height="110" rx="14" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="548" y="0" width="250" height="1" fill="#d41514" opacity="0.35"/>
    <text x="572" y="34" class="stat-val" fill="#f0403f">2</text>
    <text x="572" y="58" class="stat-lbl" fill="#f0403f">contradicted</text>
    <rect x="822" y="0" width="250" height="110" rx="14" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="822" y="0" width="250" height="1" fill="#f59e0b" opacity="0.35"/>
    <text x="846" y="34" class="stat-val" fill="#fbbf24">1</text>
    <text x="846" y="58" class="stat-lbl" fill="#fbbf24">unsupported</text>
  </g>

  <!-- Claims table -->
  <g transform="translate(300, 260)">
    <text x="0" y="18" class="section">Claims queue</text>
    <rect x="0" y="32" width="1120" height="560" rx="16" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="0" y="32" width="1120" height="1" fill="#d41514" opacity="0.35"/>
    <!-- table header -->
    <rect x="24" y="56" width="1072" height="44" rx="8" class="surface" fill="#1a1a1a"/>
    <text x="38" y="80" class="row-muted" font-size="11">ID</text>
    <text x="260" y="80" class="row-muted" font-size="11">Claim text</text>
    <text x="700" y="80" class="row-muted" font-size="11">Verdict</text>
    <text x="840" y="80" class="row-muted" font-size="11">Confidence</text>
    <text x="960" y="80" class="row-muted" font-size="11">Updated</text>
    <!-- rows -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="1072" height="44" rx="6" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="38" y="28" class="row-text">claim-003</text>
      <text x="260" y="28" class="row-text">Q3 revenue grew 12% YoY</text>
      <rect x="700" y="10" width="72" height="24" rx="999" class="badge" fill="#d41514/20" stroke="#d41514" stroke-width="1"/>
      <text x="736" y="28" text-anchor="middle" class="mono" fill="#f0403f" font-size="10.5" font-weight="700">Contradicted</text>
      <text x="840" y="28" class="mono" fill="#a8a8a8" font-size="10.5">68%</text>
      <text x="960" y="28" class="row-muted" font-size="10.5">14m ago</text>
    </g>
    <g transform="translate(24, 164)">
      <rect x="0" y="0" width="1072" height="44" rx="6" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="38" y="28" class="row-text">claim-007</text>
      <text x="260" y="28" class="row-text">Server uptime SLA met at 99.9%</text>
      <rect x="700" y="10" width="72" height="24" rx="999" class="badge" fill="#22c55e/20" stroke="#22c55e" stroke-width="1"/>
      <text x="736" y="28" text-anchor="middle" class="mono" fill="#4ade80" font-size="10.5" font-weight="700">Verified</text>
      <text x="840" y="28" class="mono" fill="#a8a8a8" font-size="10.5">92%</text>
      <text x="960" y="28" class="row-muted" font-size="10.5">1h ago</text>
    </g>
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="1072" height="44" rx="6" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="38" y="28" class="row-text">claim-012</text>
      <text x="260" y="28" class="row-text">API latency p95 under 200ms</text>
      <rect x="700" y="10" width="72" height="24" rx="999" class="badge" fill="#f59e0b/20" stroke="#f59e0b" stroke-width="1"/>
      <text x="736" y="28" text-anchor="middle" class="mono" fill="#fbbf24" font-size="10.5" font-weight="700">Unsupported</text>
      <text x="840" y="28" class="mono" fill="#a8a8a8" font-size="10.5">41%</text>
      <text x="960" y="28" class="row-muted" font-size="10.5">3h ago</text>
    </g>
    <g transform="translate(24, 272)">
      <rect x="0" y="0" width="1072" height="44" rx="6" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="38" y="28" class="row-text">claim-019</text>
      <text x="260" y="28" class="row-text">Backup completed nightly</text>
      <rect x="700" y="10" width="72" height="24" rx="999" class="badge" fill="#22c55e/20" stroke="#22c55e" stroke-width="1"/>
      <text x="736" y="28" text-anchor="middle" class="mono" fill="#4ade80" font-size="10.5" font-weight="700">Verified</text>
      <text x="840" y="28" class="mono" fill="#a8a8a8" font-size="10.5">97%</text>
      <text x="960" y="28" class="row-muted" font-size="10.5">5h ago</text>
    </g>
    <text x="0" y="590" class="label">Table · sticky crimson header · semantic badges · tabular numerals · hover lift</text>
  </g>

  <!-- AI verdict panel (right rail) -->
  <g transform="translate(300+1120+40, 260)">
    <rect x="0" y="0" width="300" height="320" rx="16" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#dbShadow)"/>
    <rect x="0" y="0" width="300" height="1" fill="#d41514" opacity="0.35"/>
    <text x="24" y="30" class="serif" fill="#cdcbc8" font-size="17" font-weight="600">AI verdict — claim-003</text>
    <rect x="24" y="46" width="252" height="1" fill="#1a1a1a"/>
    <text x="24" y="74" class="mono" fill="#a8a8a8" font-size="11.5">Q3 revenue grew 12% YoY</text>
    <text x="24" y="96" class="mono" fill="#f0403f" font-size="13" font-weight="700">▸ Contradicted · 68% confidence</text>
    <rect x="24" y="114" width="252" height="6" rx="3" fill="#262626"/>
    <rect x="24" y="114" width="171" height="6" rx="3" fill="#d41514"/>
    <text x="24" y="138" class="mono" fill="#737373" font-size="10">Evidence: 3 sources · 1 conflict</text>
    <text x="24" y="158" class="section">Retrieval trace</text>
    <rect x="24" y="172" width="252" height="104" rx="8" class="surface" fill="#080808" stroke="#1a1a1a" stroke-width="1"/>
    <text x="38" y="190" class="mono" fill="#737373" font-size="10">sparse(vec) → dense → rerank → cite</text>
    <text x="38" y="210" class="mono" fill="#cdcbc8" font-size="10">● doc://finance/q3-report.pdf · lines 12–19</text>
    <text x="38" y="230" class="mono" fill="#a8a8a8" font-size="10">● doc://policy/sla.md · lines 4–11</text>
    <text x="24" y="264" class="label">Panel · streaming state · live region · never color-only</text>
  </g>

  <text x="300" y="860" class="mono" fill="#4d4d4d" font-size="10" letter-spacing="0.04em">TrustRAG · The Ledger v3 · Dashboard concept · Dark-only · Visual deliverable only · No source modified</text>
</svg>
