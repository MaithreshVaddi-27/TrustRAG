<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TrustRAG — Design System Overview</title>
  <desc id="desc">Genuine designed mockup: Obsidian × Chrome Silver × Laser Crimson dark-luxury design system, WCAG 2.2 AA, dark-only.</desc>
  <defs>
    <linearGradient id="crimsonEdge" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#d41514"/>
      <stop offset="50%" stop-color="#f0403f"/>
      <stop offset="100%" stop-color="#d41514"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .bg { fill:#080808; }
      .hairline { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .serif { font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
      .sans { font-family:Inter, system-ui, sans-serif; }
      .mono { font-family:'JetBrains Mono', monospace; }
      .masthead { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:26; font-weight:700; letter-spacing:-0.02em; }
      .mast-sub { fill:#737373; font-family:Inter,sans-serif; font-size:12; }
      .section { fill:#d41514; font-family:Inter,sans-serif; font-size:13; font-weight:600; letter-spacing:0.02em; }
      .label { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:10; letter-spacing:0.04em; }
      .hex { fill:#d41514; font-family:'JetBrains Mono',monospace; font-size:11; font-weight:700; }
      .name { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:12.5; font-weight:600; letter-spacing:-0.01em; }
      .surface { rx:10; stroke:#1a1a1a; stroke-width:1; }
      .btn { rx:10; cursor:pointer; }
      .btn-text { fill:#080808; font-family:Inter,sans-serif; font-size:14; font-weight:700; }
      .badge { rx:999; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect x="0" y="0" width="1440" height="1" fill="#1a1a1a" opacity="0.6"/>

  <!-- Masthead -->
  <text x="40" y="48" class="masthead">TrustRAG</text>
  <text x="40" y="70" class="mast-sub">The Ledger v3 · Design System · Dark-only</text>
  <line x1="40" y1="82" x2="120" y2="82" stroke="#d41514" stroke-width="2"/>
  <text x="1260" y="46" class="label" text-anchor="end">WCAG 2.2 AA · Dark canonical</text>

  <!-- Brand -->
  <text x="40" y="124" class="section">Brand identity</text>
  <rect x="40" y="138" width="76" height="76" rx="16" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
  <text x="78" y="174" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="32" font-weight="800">T</text>
  <text x="132" y="166" class="masthead" font-size="17">TrustRAG</text>
  <text x="132" y="188" class="mast-sub">AI Reliability &amp; Hallucination Audit Workbench</text>
  <text x="132" y="210" class="label">Obsidian · Chrome silver · Laser crimson · Dark-only</text>

  <!-- Color tokens -->
  <text x="40" y="252" class="section">Semantic color tokens</text>
  <g transform="translate(40, 268)">
    <rect x="0" y="0" width="140" height="40" rx="8" class="surface" fill="#080808"/>
    <text x="12" y="28" class="label">surface-950</text>
    <text x="12" y="44" class="hex">#080808</text>
    <rect x="160" y="0" width="140" height="40" rx="8" class="surface" fill="#121212"/>
    <text x="172" y="28" class="label">surface-900 (card)</text>
    <text x="172" y="44" class="hex">#121212</text>
    <rect x="320" y="0" width="140" height="40" rx="8" class="surface" fill="#1a1a1a"/>
    <text x="332" y="28" class="label">surface-800</text>
    <text x="332" y="44" class="hex">#1a1a1a</text>
    <rect x="480" y="0" width="140" height="40" rx="8" class="surface" fill="#262626"/>
    <text x="492" y="28" class="label">surface-700</text>
    <text x="492" y="44" class="hex">#262626</text>
    <rect x="640" y="0" width="140" height="40" rx="8" class="surface" fill="#cdcbc8"/>
    <text x="652" y="28" class="label" fill="#080808" font-weight="700">chrome-silver</text>
    <text x="652" y="44" class="hex" fill="#080808" font-weight="700">#cdcbc8</text>
  </g>
  <g transform="translate(40, 328)">
    <rect x="0" y="0" width="140" height="40" rx="8" class="surface" fill="#d41514"/>
    <text x="12" y="28" class="label" fill="#fff" font-weight="700">laser-crimson</text>
    <text x="12" y="44" class="hex" fill="#fff" font-weight="700">#d41514 · brand + primary CTA</text>
    <rect x="160" y="0" width="140" height="40" rx="8" class="surface" fill="#22c55e"/>
    <text x="172" y="28" class="label">verified</text>
    <text x="172" y="44" class="hex">#22c55e · emerald · 4.9:1</text>
    <rect x="320" y="0" width="140" height="40" rx="8" class="surface" fill="#f59e0b"/>
    <text x="332" y="28" class="label">unsupported</text>
    <text x="332" y="44" class="hex">#f59e0b · amber · large only</text>
    <rect x="480" y="0" width="140" height="40" rx="8" class="surface" fill="#737373"/>
    <text x="492" y="28" class="label">unknown</text>
    <text x="492" y="44" class="hex">#737373 · slate</text>
    <rect x="640" y="0" width="140" height="40" rx="8" class="surface" fill="#f0403f"/>
    <text x="652" y="28" class="label">crimson-light</text>
    <text x="652" y="44" class="hex">#f0403f · hover state</text>
  </g>

  <!-- Typography -->
  <text x="40" y="400" class="section">Typography scale</text>
  <g transform="translate(40, 416)">
    <text x="0" y="0" class="serif" fill="#cdcbc8" font-size="46" font-weight="700" letter-spacing="-0.025em">TrustRAG</text>
    <text x="0" y="26" class="label">Display · clamp(2.5rem, 5vw, 4.5rem) · serif 700 · -0.025em</text>
    <text x="0" y="56" class="serif" fill="#cdcbc8" font-size="30" font-weight="600" letter-spacing="-0.015em">Analysis completed — 14 claims verified</text>
    <text x="0" y="80" class="label">Heading-1 · clamp(1.875rem, 3vw, 2.5rem)</text>
    <text x="0" y="106" class="sans" fill="#a8a8a8" font-size="17" line-height="1.65" max-width="420">Body copy in Inter at 1rem with comfortable leading for long-form audit narratives.</text>
    <text x="0" y="128" class="label">Body · 1rem / 1.65 · Inter · tracking 0</text>
    <text x="0" y="154" class="mono" fill="#d41514" font-size="15" letter-spacing="0.04em">0x7f3a → claim.verified = true</text>
    <text x="0" y="174" class="label">Mono · 0.875rem / 1.55 · JetBrains Mono · 0.04em tracking</text>
  </g>

  <!-- Spacing / radius / motion -->
  <text x="520" y="400" class="section">Spacing, radius &amp; motion</text>
  <g transform="translate(520, 416)">
    <text x="0" y="18" class="name" font-size="13">4pt grid</text>
    <text x="0" y="38" class="label">--space-1 4px · --space-2 8px · --space-3 12px · --space-4 16px · --space-6 24px · --space-8 32px</text>
    <text x="0" y="64" class="name" font-size="13">Radii</text>
    <text x="0" y="84" class="label">sm 8px · md 12px · lg 16px · xl 20px · full 9999px</text>
    <text x="0" y="110" class="name" font-size="13">Motion (Apple springs)</text>
    <text x="0" y="130" class="label">Critically damped (bounce 0) · response 0.3–0.4s · press 80ms · reduced-motion → cross-fade</text>
    <rect x="0" y="144" width="120" height="24" rx="6" class="surface" fill="#121212"/>
    <text x="10" y="163" class="label">44px min touch target</text>
  </g>

  <!-- Component preview -->
  <text x="1000" y="400" class="section">Component library</text>
  <g transform="translate(1000, 416)">
    <rect x="0" y="0" width="130" height="42" rx="10" class="btn" fill="#d41514" filter="url(#shadow)"/>
    <text x="65" y="27" text-anchor="middle" class="btn-text" font-size="13">Run analysis</text>
    <text x="0" y="58" class="label">Button · crimson · 44px min</text>
    <rect x="0" y="72" width="130" height="36" rx="10" class="surface" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="65" y="93" text-anchor="middle" class="name" font-size="13" fill="#a8a8a8">Secondary</text>
    <text x="0" y="117" class="label">Input · surface-800 · focus ring crimson</text>
    <rect x="0" y="130" width="130" height="36" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
    <text x="12" y="152" class="mono" fill="#737373" font-size="10.5">api.v1.analyses</text>
    <text x="0" y="176" class="label">Card · glass · lift-hover</text>
    <rect x="0" y="190" width="130" height="86" rx="10" class="surface" fill="#121212" stroke="#1a1a1a" stroke-width="1" filter="url(#shadow)"/>
    <rect x="0" y="190" width="130" height="1" fill="#d41514" opacity="0.35"/>
    <text x="14" y="216" class="serif" fill="#cdcbc8" font-size="16" font-weight="600">14</text>
    <text x="14" y="236" class="mono" fill="#737373" font-size="10">Claims verified</text>
    <text x="14" y="256" class="mono" fill="#22c55e" font-size="9.5" font-weight="700">● Verified</text>
    <text x="0" y="296" class="label">Stat card · tabular numerals</text>
  </g>

  <!-- Accessibility -->
  <text x="40" y="744" class="section">Accessibility · WCAG 2.2 AA</text>
  <g transform="translate(40, 758)">
    <rect x="0" y="0" width="200" height="100" rx="10" class="surface" fill="#121212"/>
    <text x="14" y="24" class="name" font-size="13">Compliance</text>
    <text x="14" y="44" class="label">• Body ≥ 4.5:1 on obsidian</text>
    <text x="14" y="62" class="label">• Focus ring visible, 2px crimson</text>
    <text x="14" y="80" class="label">• Never color-only state</text>
    <text x="220" y="24" class="name" font-size="13">Reduced motion</text>
    <text x="220" y="44" class="label">• Springs → cross-fade under reduce</text>
    <text x="220" y="62" class="label">• Transparency → solid fallbacks</text>
    <text x="220" y="80" class="label">• Contrast → hairline-strong borders</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="864" x2="1400" y2="864" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
  <text x="40" y="886" class="label">TrustRAG · The Ledger v3 · Obsidian × Chrome × Crimson · Dark-only · Visual deliverable only</text>
  <text x="1260" y="886" class="label" text-anchor="end">No source code modified · Prepared for approval</text>
</svg>
