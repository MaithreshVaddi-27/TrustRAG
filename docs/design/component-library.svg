<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TrustRAG — Component Library</title>
  <desc id="desc">Genuine designed mockup: TrustRAG UI primitives — buttons, inputs, badges, cards, stat tiles, navigation, dialogs, AI streaming states — Obsidian × Chrome × Crimson, dark-only, WCAG 2.2 AA.</desc>
  <defs>
    <linearGradient id="clCrimson" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#d41514"/>
      <stop offset="100%" stop-color="#f0403f"/>
    </linearGradient>
    <filter id="clShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill:#080808; }
      .surface { fill:#121212; }
      .surface2 { fill:#1a1a1a; }
      .hairline { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .mono { font-family:'JetBrains Mono', monospace; }
      .serif { font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
      .sans { font-family:Inter, system-ui, sans-serif; }
      .title { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:24; font-weight:700; letter-spacing:-0.01em; }
      .sub { fill:#737373; font-family:Inter,sans-serif; font-size:13; }
      .label { fill:#737373; font-family:'JetBrains Mono',monospace; font-size:10; letter-spacing:0.04em; }
      .btn { rx:10; cursor:pointer; }
      .btn-text { fill:#080808; font-family:Inter,sans-serif; font-size:14; font-weight:700; }
      .input { fill:#1a1a1a; rx:10; stroke:#3a3a3a; stroke-width:1.5; }
      .badge { rx:999; }
      .dot { fill:#22c55e; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <line x1="40" y1="1" x2="1400" y2="1" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>

  <text x="40" y="44" class="title">Component library</text>
  <text x="40" y="64" class="sub">Primitives built once, reused everywhere · 44px minimum touch targets · visible focus rings · never color-only state</text>

  <!-- Buttons -->
  <g transform="translate(40, 100)">
    <text x="0" y="18" class="sans" fill="#d41514" font-size="14" font-weight="700">Buttons</text>
    <rect x="0" y="30" width="170" height="46" rx="10" class="btn" fill="#d41514" filter="url(#clShadow)"/>
    <text x="85" y="59" text-anchor="middle" class="btn-text">Run analysis</text>
    <text x="0" y="90" class="label">Primary · laser crimson · 44px min</text>
    <rect x="200" y="30" width="170" height="46" rx="10" class="btn" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="285" y="59" text-anchor="middle" class="btn-text" fill="#a8a8a8">Secondary</text>
    <text x="200" y="90" class="label">Secondary · border</text>
    <rect x="400" y="30" width="170" height="46" rx="10" class="btn" fill="#d41514" opacity="0.5"/>
    <text x="485" y="59" text-anchor="middle" class="btn-text" fill="#080808">Disabled</text>
    <text x="400" y="90" class="label">Disabled · 50% opacity</text>
    <rect x="600" y="30" width="170" height="46" rx="10" class="btn" fill="#f0403f"/>
    <text x="685" y="59" text-anchor="middle" class="btn-text" fill="#080808">Export report</text>
    <text x="600" y="90" class="label">Luxury · crimson-light CTA edge</text>
    <rect x="800" y="30" width="46" height="46" rx="10" class="btn" fill="#1a1a1a"/>
    <circle cx="823" cy="53" r="4" fill="#d41514"/>
    <text x="800" y="90" class="label">Icon-only · aria-label</text>
  </g>

  <!-- Inputs & badges -->
  <g transform="translate(40, 170)">
    <text x="0" y="18" class="sans" fill="#d41514" font-size="14" font-weight="700">Inputs &amp; badges</text>
    <rect x="0" y="30" width="260" height="46" rx="10" class="input"/>
    <text x="14" y="54" class="mono" fill="#a8a8a8" font-size="13">org/Name-GGUF:Q4_K_M</text>
    <text x="0" y="86" class="label">Input · surface-800 · focus ring crimson · 44px</text>
    <rect x="300" y="30" width="78" height="26" rx="999" class="badge" fill="#22c55e/20" stroke="#22c55e" stroke-width="1"/>
    <text x="316" y="49" class="mono" fill="#4ade80" font-size="10.5" font-weight="700">● Verified</text>
    <text x="300" y="64" class="label">Badge · verified</text>
    <rect x="400" y="30" width="86" height="26" rx="999" class="badge" fill="#d41514/20" stroke="#d41514" stroke-width="1"/>
    <text x="416" y="49" class="mono" fill="#f0403f" font-size="10.5" font-weight="700">● Contradicted</text>
    <text x="400" y="64" class="label">Badge · crimson</text>
    <rect x="510" y="30" width="82" height="26" rx="999" class="badge" fill="#f59e0b/20" stroke="#f59e0b" stroke-width="1"/>
    <text x="526" y="49" class="mono" fill="#fbbf24" font-size="10.5" font-weight="700">● Unsupported</text>
    <text x="510" y="64" class="label">Badge · amber</text>
    <rect x="616" y="30" width="70" height="26" rx="999" class="badge" fill="#737373/20" stroke="#737373" stroke-width="1"/>
    <text x="632" y="49" class="mono" fill="#a8a8a8" font-size="10.5" font-weight="700">● Unknown</text>
    <text x="616" y="64" class="label">Badge · slate</text>
  </g>

  <!-- Cards & stat -->
  <g transform="translate(40, 260)">
    <text x="0" y="18" class="sans" fill="#d41514" font-size="14" font-weight="700">Cards &amp; stat tiles</text>
    <rect x="0" y="30" width="260" height="150" rx="14" class="surface2" stroke="#1a1a1a" stroke-width="1" filter="url(#clShadow)"/>
    <rect x="0" y="30" width="260" height="1" fill="#d41514" opacity="0.35"/>
    <text x="18" y="62" class="serif" fill="#cdcbc8" font-size="22" font-weight="600">14</text>
    <text x="18" y="86" class="mono" fill="#737373" font-size="11">Claims verified</text>
    <text x="18" y="108" class="mono" fill="#22c55e" font-size="10" font-weight="700">● Verified · 4.9:1 contrast</text>
    <text x="0" y="200" class="label">Card · glass · hairline top · lift-hover · tabular numerals</text>
    <rect x="300" y="30" width="130" height="150" rx="14" class="surface2" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 6"/>
    <text x="316" y="100" text-anchor="middle" class="mono" fill="#4d4d4d" font-size="11">Empty state</text>
    <text x="300" y="200" class="label">Card · dashed · empty</text>
  </g>

  <!-- Navigation / dialog -->
  <g transform="translate(780, 100)">
    <text x="0" y="18" class="sans" fill="#d41514" font-size="14" font-weight="700">Navigation &amp; overlays</text>
    <rect x="0" y="30" width="200" height="46" rx="10" class="surface2" stroke="#d41514" stroke-width="1.5"/>
    <text x="14" y="54" class="mono" fill="#d41514" font-size="13" font-weight="600">▸ WORKBENCH</text>
    <text x="0" y="84" class="label">Sidebar · active pill · 44px</text>
    <rect x="0" y="96" width="200" height="46" rx="10" class="surface2" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="120" class="mono" fill="#a8a8a8" font-size="13">EVIDENCE</text>
    <rect x="0" y="150" width="200" height="46" rx="10" class="surface2" stroke="#1a1a1a" stroke-width="1"/>
    <text x="14" y="174" class="mono" fill="#a8a8a8" font-size="13">SYSTEM</text>
    <text x="0" y="206" class="label">Nav links · section labels · aria-expanded</text>
  </g>
  <g transform="translate(780, 280)">
    <rect x="0" y="0" width="620" height="320" rx="16" class="surface2" stroke="#1a1a1a" stroke-width="1" filter="url(#clShadow)"/>
    <rect x="0" y="0" width="620" height="1" fill="#d41514" opacity="0.35"/>
    <text x="26" y="38" class="serif" fill="#cdcbc8" font-size="20" font-weight="600">Confirm analysis</text>
    <text x="26" y="62" class="mono" fill="#737373" font-size="12">This will mark 14 claims as verified and write to the knowledge base.</text>
    <rect x="450" y="240" width="76" height="36" rx="8" fill="#d41514" opacity="0.45"/>
    <text x="488" y="261" text-anchor="middle" class="btn-text" font-size="12" fill="#080808">Cancel</text>
    <rect x="536" y="240" width="76" height="36" rx="8" fill="#d41514"/>
    <text x="574" y="261" text-anchor="middle" class="btn-text" font-size="12" fill="#080808">Confirm</text>
    <text x="26" y="298" class="label">Dialog · glass · role=alert · focus trap</text>
  </g>

  <!-- AI streaming states -->
  <g transform="translate(780, 640)">
    <text x="0" y="18" class="sans" fill="#d41514" font-size="14" font-weight="700">AI response &amp; streaming</text>
    <rect x="0" y="30" width="620" height="120" rx="12" class="surface2" stroke="#1a1a1a" stroke-width="1"/>
    <text x="26" y="58" class="sans" fill="#cdcbc8" font-size="13">Streaming… <tspan fill="#d41514" font-family:'JetBrains Mono',monospace font-size="12">claim.3 → verified</tspan></text>
    <rect x="26" y="74" width="200" height="4" rx="2" fill="#262626"/>
    <rect x="26" y="74" width="90" height="4" rx="2" fill="#d41514"/>
    <text x="26" y="112" class="mono" fill="#4d4d4d" font-size="11">ThinkingOrbs · pulsing · reduced-motion safe</text>
    <text x="0" y="168" class="label">Streaming states · live region · never color-only</text>
  </g>

  <text x="40" y="882" class="sub" fill="#4d4d4d">TrustRAG · The Ledger v3 · Dark-only · WCAG 2.2 AA · Visual deliverable only · No source modified</text>
</svg>
