      <text x="12" y="18" class="stat-val" font-size="16">14k+</text>
      <text x="12" y="34" class="stat-lbl">claims audited</text>
    </g>
    <text x="14" y="678" class="label">Tablet 768 · hamburger menu</text>
  </g>

  <!-- 390px mobile -->
