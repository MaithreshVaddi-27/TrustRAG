      <text x="25" y="12" class="nav-text" font-size="11">TrustRAG</text>
      <text x="94" y="12" class="nav-text" font-size="11">☰</text>
    </g>
    <g transform="translate(14, 64)">
      <text x="0" y="14" class="kicker">AI RELIABILITY &amp; AUDIT</text>
      <text x="0" y="42" class="hero-main" font-size="20">Every claim,<br/>verified end to end.</text>
      <text x="0" y="66" class="hero-sub" font-size="11.5" max-width="92">TrustRAG decomposes claims, retrieves evidence, returns a verdict.</text>
      <rect x="0" y="86" width="1" height="16" stroke="#d41514" stroke-width="1.5"/>
