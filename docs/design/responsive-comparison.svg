      <text x="0" y="46" class="hero-main" font-size="27">Every claim,<br/>verified end to end.</text>
      <text x="0" y="76" class="hero-sub" font-size="12.5" max-width="168">TrustRAG decomposes claims, retrieves evidence, returns a verified, contradicted, or unsupported verdict.</text>
      <rect x="0" y="98" width="1" height="20" stroke="#d41514" stroke-width="1.5"/>
      <rect x="0" y="126" width="96" height="34" rx="8" class="btn" fill="#d41514"/>
      <text x="48" y="150" text-anchor="middle" class="btn-text" font-size="11" fill="#080808">Start audit</text>
