      <text x="0" y="44" class="hero-main" font-size="23">Every claim,<br/>verified end to end.</text>
      <text x="0" y="70" class="hero-sub" font-size="12" max-width="130">TrustRAG decomposes claims, retrieves evidence, returns a verdict.</text>
      <rect x="0" y="90" width="1" height="18" stroke="#d41514" stroke-width="1.5"/>
      <rect x="0" y="116" width="82" height="32" rx="8" class="btn" fill="#d41514"/>
      <text x="41" y="138" text-anchor="middle" class="btn-text" font-size="10" fill="#080808">Start audit</text>
