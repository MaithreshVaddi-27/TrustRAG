<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TrustRAG — Responsive Comparison</title>
  <desc id="desc">Genuine designed mockup: TrustRAG landing page across six breakpoints — 1440, 1280, 1024, 768, 390, 320px — dark-only, same composition reflowed.</desc>
  <defs>
    <linearGradient id="rcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <style>
      .bg { fill:#080808; }
      .hairline { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .serif { font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
      .sans { font-family:Inter, system-ui, sans-serif; }
      .mono { font-family:'JetBrains Mono', monospace; }
      .title { fill:#cdcbc8; font-family:Inter,sans-serif; font-size:24; font-weight:700; letter-spacing:-0.01em; }
      .sub { fill:#737373; font-family:Inter,sans-serif; font-size:13; }
      .label { fill:#737373; font-family:'JetBrains Mono',monospace; font-size=10; letter-spacing:0.04em; }
      .bp { fill:#d41514; font-family:'JetBrains Mono',monospace; font-size=11; font-weight:700; }
      .frame { rx:12; stroke:#1a1a1a; stroke-width:1; }
      .nav-text { fill:#cdcbc8; font-family:Inter,sans-serif; font-size=13; font-weight=600; }
      .hero-main { fill:#cdcbc8; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-weight=800; letter-spacing=-0.025em; }
      .hero-sub { fill:#a8a8a8; font-family:Inter,sans-serif; }
      .kicker { fill:#d41514; font-family:'JetBrains Mono',monospace; font-size=10; letter-spacing:0.05em; font-weight=700; }
      .btn { rx:10; cursor=pointer; }
      .btn-text { fill:#080808; font-family:Inter,sans-serif; font-weight=700; }
      .stat-val { fill:#cdcbc8; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-weight=700; letter-spacing=-0.02em; }
      .stat-lbl { fill:#737373; font-family:'JetBrains Mono',monospace; font-size=9.5; letter-spacing:0.04em; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <line x1="40" y1="1" x2="1400" y2="1" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>

  <text x="40" y="44" class="title">Responsive review</text>
  <text x="40" y="64" class="sub">Same composition at six breakpoints — 1440 · 1280 · 1024 · 768 · 390 · 320px · dark-only · 44px touch targets throughout</text>

  <!-- Helper group for a breakpoint card -->
  <g id="bp-card">
    <!-- frame, navbar, hero, stats drawn per instance via transform -->
  </g>

  <!-- 1440px desktop -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="224" height="700" rx="12" class="frame" fill="#121212"/>
    <rect x="0" y="0" width="224" height="1" fill="#1a1a1a"/>
    <text x="14" y="18" class="bp">1440px</text>
    <g transform="translate(14, 28)">
      <rect x="0" y="-8" width="28" height="28" rx="7" fill="#1a1a1a" stroke="#d41514" stroke-width="1.5"/>
      <text x="14" y="10" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="14" font-weight="800">T</text>
      <text x="28" y="12" class="nav-text" font-size="12">TrustRAG</text>
      <rect x="150" y="-8" width="60" height="28" rx="7" class="btn" fill="#d41514"/>
      <text x="180" y="8" text-anchor="middle" class="btn-text" font-size="11" fill="#080808">Get started</text>
    </g>
    <g transform="translate(14, 74)">
      <text x="0" y="14" class="kicker">AI RELIABILITY &amp; HALLUCINATION AUDIT</text>
      <text x="0" y="46" class="hero-main" font-size="30">Every claim,<br/>verified end to end.</text>
      <text x="0" y="76" class="hero-sub" font-size="13" max-width="190">TrustRAG decomposes claims, retrieves evidence, returns a verified, contradicted, or unsupported verdict.</text>
      <rect x="0" y="98" width="1" height="20" stroke="#d41514" stroke-width="1.5"/>
      <rect x="0" y="126" width="106" height="34" rx="8" class="btn" fill="#d41514"/>
      <text x="53" y="150" text-anchor="middle" class="btn-text" font-size="11" fill="#080808">Start audit</text>
    </g>
    <g transform="translate(14, 176)">
      <rect x="0" y="0" width="196" height="64" rx="10" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="16" y="26" class="stat-val" font-size="20">14k+</text>
      <text x="16" y="46" class="stat-lbl">claims audited</text>
    </g>
    <text x="14" y="678" class="label">Desktop 1440 · hero left + stats below</text>
  </g>

  <!-- 1280px -->
  <g transform="translate(278, 96)">
    <rect x="0" y="0" width="198" height="700" rx="12" class="frame" fill="#121212"/>
    <rect x="0" y="0" width="198" height="1" fill="#1a1a1a"/>
    <text x="14" y="18" class="bp">1280px</text>
