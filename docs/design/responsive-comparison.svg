      <text x="14" y="10" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="14" font-weight="800">T</text>
      <text x="28" y="12" class="nav-text" font-size="12">TrustRAG</text>
      <rect x="126" y="-8" width="58" height="28" rx="7" class="btn" fill="#d41514"/>
      <text x="155" y="8" text-anchor="middle" class="btn-text" font-size="11" fill="#080808">Get started</text>
    </g>
