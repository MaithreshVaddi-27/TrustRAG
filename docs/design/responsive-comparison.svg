      <text x="12" y="10" text-anchor="middle" fill="#d41514" font-family:Inter,sans-serif font-size="12" font-weight="800">T</text>
      <text x="24" y="12" class="nav-text" font-size="10">TrustRAG</text>
      <text x="52" y="12" class="nav-text" font-size="10">☰</text>
    </g>
    <g transform="translate(14, 58)">
      <text x="0" y="12" class="kicker">AI RELIABILITY &amp; AUDIT</text>
      <text x="0" y="36" class="hero-main" font-size="18">Every claim,<br/>verified end to end.</text>
      <text x="0" y="58" class="hero-sub" font-size="10.5" max-width="44">TrustRAG decomposes claims, retrieves evidence, returns a verdict.</text>
      <rect x="0" y="78" width="1" height="16" stroke="#d41514" stroke-width="1.5"/>
      <rect x="0" y="102" width="32" height="28" rx="8" class="btn" fill="#d41514"/>
      <text x="16" y="122" text-anchor="middle" class="btn-text" font-size="9" fill="#080808">Start</text>
    </g>
    <g transform="translate(14, 144)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#121212" stroke="#1a1a1a" stroke-width="1"/>
      <text x="6" y="16" class="stat-val" font-size="14">14k+</text>
      <text x="6" y="30" class="stat-lbl">claims</text>
    </g>
    <text x="14" y="678" class="label">Mobile 390 · stacked, 44px touch</text>
  </g>

  <!-- 320px mobile -->
  <g transform="translate(868, 96)">
    <rect x="0" y="0" width="52" height="700" rx="12" class="frame" fill="#121212"/>
    <rect x="0" y="0" width="52" height="1" fill="#1a1a1a"/>
    <text x="14" y="18" class="bp">320px</text>
    <g transform="translate(14, 28)">
