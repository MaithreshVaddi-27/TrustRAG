# ─────────────────────────────────────────────────────────────────────────────
# TRUSTRAG — Local Development docker-compose
# ─────────────────────────────────────────────────────────────────────────────
# Provides:
#   - FastAPI backend (with hot-reload)
#   - Qdrant vector store (local, free)
#
# MongoDB Atlas is NOT run locally — use the cloud M0 free tier.
# Gemini API is accessed remotely — requires GEMINI_API_KEY in .env.
#
# Usage:
#   cp .env.example .env        # Fill in GEMINI_API_KEY and MONGODB_URI
#   docker compose up
#
# For local Qdrant, QDRANT_URL should be: http://qdrant:6333 (container network)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: trustrag_qdrant
    ports:
      # Host port 6335 avoids conflict with other Qdrant instances on 6333.
      # The API container uses http://qdrant:6333 (Docker network) — unaffected.
      - "6335:6333"
      - "6336:6334"   # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      # qdrant/qdrant has no curl or wget — use bash /dev/tcp for a pure TCP check.
      # bash is available in the image (/bin/bash exists).
      # This opens a TCP connection to port 6333; exits 0 if port is listening.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # ── Local MongoDB ───────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: trustrag_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: builder          # Use builder stage for dev (includes dev tools)
    container_name: trustrag_api
    working_dir: /build
    command: >
      sh -c "PYTHONPATH=/build uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /build/app
      --log-level info"
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload
      - ./apps/api/app:/build/app:ro
      - ./apps/api/config:/build/config:ro
      - ./apps/api/tests:/build/tests:ro
      # Persist model cache across restarts (sentence-transformers download)
      - model_cache:/build/.model_cache
    env_file:
      - .env
    environment:
      # Override QDRANT_URL and MONGODB_URI to use docker network
      QDRANT_URL: http://qdrant:6333
      MONGODB_URI: mongodb://mongodb:27017/trustrag_db
    depends_on:
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      # python:slim includes wget; use it for consistency with Qdrant healthcheck.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s   # Extra time: Mongo connect retries (~2.5 min worst case)
                            # to ride out Atlas M0 auto-resume, plus first-run
                            # sentence-transformer model download.
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  model_cache:
    driver: local
  mongodb_data:
    driver: local


