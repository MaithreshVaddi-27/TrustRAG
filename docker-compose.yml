# ─────────────────────────────────────────────────────────────────────────────
# TRUSTRAG — Full-Stack Development docker-compose
# ─────────────────────────────────────────────────────────────────────────────
# Provides:
#   - FastAPI backend (Port 8080, with hot-reload & local/cloud model support)
#   - React Frontend Workbench (Port 5173, Vite)
#   - Qdrant vector store (Port 6335 host / 6333 container, local storage)
#
# Connects seamlessly to host-running Ollama (:11434), llama-server (:8081),
# and local MongoDB (:27017) via host.docker.internal.
#
# Usage:
#   cp .env.example .env
#   docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: trustrag_qdrant
    ports:
      - "6335:6333"
      - "6336:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────────────────────
  # NOTE: targets the hardened `runtime` stage (non-root, no build tools),
  # NOT the `builder` stage. Hot-reload still works because source is bind-mounted.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: trustrag_api
    working_dir: /app
    command: >
      sh -c "PYTHONPATH=/app uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/app
      --log-level info"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/app:/app/app:ro
      - ./apps/api/config:/app/config:ro
      - ./apps/api/tests:/app/tests:ro
      - model_cache:/app/.model_cache
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # No database name suffix here: MONGODB_DATABASE (in .env) is the single
      # source of truth for the DB name — never encode it in the URI.
      MONGODB_URI: mongodb://host.docker.internal:27017
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── React Frontend Workbench ──────────────────────────────────────────────
  web:
    image: node:20-alpine
    container_name: trustrag_web
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # API ORIGIN only — the frontend appends /api/v1/... itself. Including the
      # prefix here would double it (baseURL + service path -> 2x /api/v1).
      VITE_API_BASE_URL: http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  model_cache:
    driver: local
