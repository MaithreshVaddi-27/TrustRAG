<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" fill="none" role="img" aria-label="TrustRAG — horizontal lockup">
  <!-- TrustRAG · horizontal lockup. Wordmark uses the system sans stack (air-gapped,
       no font payload); outline it if a delivery target requires embedded type. -->
  <title>TrustRAG — horizontal lockup</title>
  <svg x="8" y="8" width="240" height="240" viewBox="0 0 256 256">
    <circle cx="177" cy="128" r="54" fill="#cdcbcA"/>
    <circle cx="101" cy="128" r="76" stroke="#a3a2a0" stroke-width="18"/>
    <circle cx="154" cy="128" r="11" fill="#d41514"/>
  </svg>
  <text x="292" y="128" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="500" letter-spacing="-2" fill="#e9e9e7">TrustRAG</text>
</svg>
