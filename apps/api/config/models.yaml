# ─────────────────────────────────────────────────────────────────────────────
# TRUSTRAG — Centralized Model & Configuration Registry
# ─────────────────────────────────────────────────────────────────────────────
# This file is the single source of truth for:
#   - AI model identifiers and parameters
#   - Retrieval configuration
#   - Reliability thresholds
#   - Recovery policy
#
# NEVER hardcode values from this file into application code.
# Model IDs, thresholds, and tuning parameters MUST be read from here.
# Secrets (API keys, URIs) stay in .env — never here.
#
# config_version must be incremented when any value changes.
# The active config_version is recorded per analysis run.
# ─────────────────────────────────────────────────────────────────────────────

runtime:
  config_version: "1.0"

# ─── LLM ──────────────────────────────────────────────────────────────────────
llm:
  framework: langchain
  provider: google_genai
  # Model ID — change here only; never in application code.
  # Verify at: https://ai.google.dev/gemini-api/docs/models
  model: gemini-3.5-flash-lite
  temperature: 0.2
  top_p: 0.9
  max_output_tokens: 2048
  timeout_seconds: 60
  max_retries: 2

# ─── Embedding ────────────────────────────────────────────────────────────────
embedding:
  framework: langchain
  # sentence-transformers — fully local, free, no API key required.
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2
  # Dimension MUST match Qdrant collection configuration.
  output_dimensionality: 384
  # Increment this version when you change the embedding model.
  # A version mismatch between stored chunks and the active model
  # triggers a re-indexing requirement.
  version: "1"
  # Local model cache directory (relative to api root)
  cache_dir: .model_cache

# ─── Verification LLM ─────────────────────────────────────────────────────────
# Used for claim-level NLI/structured verification.
# Using a separate (potentially cheaper) model from the main LLM
# is intentional — allows independent cost/quality tuning.
verification:
  framework: langchain
  provider: google_genai
  model: gemini-2.5-flash
  temperature: 0.0          # Zero temperature for deterministic verification
  max_output_tokens: 1024
  timeout_seconds: 45
  max_retries: 2

# ─── Reranker ─────────────────────────────────────────────────────────────────
reranker:
  enabled: false            # Start disabled; enable after retrieval baseline
  provider: cross_encoder   # cross-encoder via sentence-transformers (free)
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 8

# ─── Retrieval ────────────────────────────────────────────────────────────────
retrieval:
  dense_top_k: 20
  sparse_top_k: 20          # BM25 via Qdrant sparse vectors
  fusion_method: rrf        # Reciprocal Rank Fusion
  rrf_k: 60                 # RRF constant (standard default)
  fusion_top_k: 20
  max_context_chunks: 8     # Maximum evidence chunks sent to LLM

# ─── Document Processing ──────────────────────────────────────────────────────
ingestion:
  chunk_size: 512           # Characters per chunk (approx. 128 tokens)
  chunk_overlap: 64
  # Supported MVP formats — do NOT add formats without clear value
  supported_formats:
    - pdf
    - txt
    - md
  max_file_size_mb: 20
  # Maximum file size for processing (deny-of-wallet defense)
  max_total_tokens_per_doc: 200000

# ─── Reliability Engine ───────────────────────────────────────────────────────
# These are engineering defaults — NOT calibrated probabilities.
# Do not present score as a probability unless calibration is performed.
reliability:
  minimum_evidence_coverage: 0.80   # Fraction of claims needing support
  maximum_contradiction_rate: 0.20  # Max fraction of contradicted claims
  abstain_below: 0.50               # Reliability score below which to abstain
  citation_correctness_weight: 0.30 # Weight in composite score
  evidence_coverage_weight: 0.40
  source_integrity_weight: 0.30

# ─── Recovery Policy ──────────────────────────────────────────────────────────
recovery:
  max_recovery_attempts: 2          # Hard ceiling — prevents infinite loops
  max_query_rewrites: 2
  max_reretrieval_attempts: 2
  # Strategy costs (relative units) — prefer cheaper strategies first
  strategy_priority:
    - query_rewrite
    - re_retrieve
    - evidence_expansion
    - conflict_resolution
    - claim_filtering
    - controlled_regeneration
    - abstention

# ─── Context & Cost Controls ──────────────────────────────────────────────────
cost_controls:
  max_input_tokens: 100000          # Hard limit per LLM call
  max_verification_claims: 20       # Skip verification above this count
  enable_response_caching: false    # Only enable for deterministic queries
