# ─────────────────────────────────────────────────────────────────────────────
# TRUSTRAG — Centralized Model & Configuration Registry
# ─────────────────────────────────────────────────────────────────────────────
# This file is the single source of truth for:
#   - AI model identifiers and parameters
#   - Retrieval configuration
#   - Reliability thresholds
#   - Recovery policy
#
# NEVER hardcode values from this file into application code.
# Model IDs, thresholds, and tuning parameters MUST be read from here.
# Secrets (API keys, URIs) stay in .env — never here.
#
# config_version must be incremented when any value changes.
# The active config_version is recorded per analysis run.
# ─────────────────────────────────────────────────────────────────────────────

runtime:
  config_version: "1.21"

# ─── LLM ──────────────────────────────────────────────────────────────────────
llm:
  framework: langchain
  # Provider options: ollama, llama_cpp, mlx (Apple Silicon), google_genai, nvidia
  provider: llama_cpp
  ollama_base_url: "http://localhost:11434"
  llamacpp_base_url: "http://127.0.0.1:8080/v1"
  mlx_base_url: "http://127.0.0.1:8090/v1"
  # Supported local models (exactly what is installed):
  #   ollama (`ollama list`):
  #     - Impulse2000/smollm3:3b-q4_K_M
  #     - granite4.2:3b-q4_K_M
  #     - gemma3:1b
  #   llama_cpp (`llama-server --cache-list`):
  #     - LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M        # DEFAULT: 1.2B, ~1GB
  #     - ibm-granite/granite-4.2-3b-GGUF:Q4_K_M            # 3B Granite, ~2.2GB
  #     - ggml-org/SmolLM3-3B-GGUF:Q4_K_M
  #     - bartowski/EXAONE-3.5-2.4B-Instruct-GGUF:Q4_K_S
  #     - ibm-granite/granite-4.0-h-1b-GGUF:Q4_K_M
  #   mlx (`mlx_lm.server`, Apple Silicon only; exact id must match --model):
  #     - mlx-community/Llama-3.2-1B-Instruct-4bit          # DEFAULT: 1B, 8GB-safe
  #     - mlx-community/Llama-3.2-3B-Instruct-4bit          # 3B, 16GB+
  #     - mlx-community/LFM2.5-1.2B-Instruct-4bit           # 1.2B LFM2.5, same family as llama_cpp default
  #     - mlx-community/Qwen3-1.7B-MLX-8bit                 # 1.7B 8-bit, 16GB+
  model: LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
  # Per-provider yaml defaults (used when the env override is empty).
  model_ollama: gemma3:1b
  model_llamacpp: LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
  model_mlx: mlx-community/Llama-3.2-1B-Instruct-4bit
  # NVIDIA NIM (cloud) default model — verified live 2026-09-21: the only
  # entitlement with a responding endpoint (gpt-oss-20b ~3s; gemma-4-31b-it
  # ~8s). nemotron-3.5-lightning-30b-a3b stalls with zero bytes.
  model_nvidia: openai/gpt-oss-20b
  # Gemini (cloud) default model — override with LLM_MODEL env or this key.
  # Stable Gemini 3 models (Sep 2025): gemini-3.8-flash (flagship), gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3.5-flash-lite
  # Deprecated: gemini-2.0-flash, gemini-2.0-flash-lite, gemini-3.1-flash-lite-preview, gemini-3-pro-preview (shut down)
  model_gemini: gemini-3.5-flash-lite
  # Cloud allowlists: the ONLY models API callers may select per provider.
  # Single source of truth — app/api/v1/schemas/analysis.py reads these.
  # Adding a newly-released model is a config change here, not a code change.
  supported_models_gemini:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
    - gemini-2.5-flash
    - gemini-2.5-pro
  # Verified live 2026-09-21: only these answer (lightning stalls,
  # nano-omni 503s, everything else 404-not-entitled).
  supported_models_nvidia:
    - openai/gpt-oss-20b
    - google/gemma-4-31b-it
    - meta/muse-glimmer-30b
  temperature: 0.2
  top_p: 0.9
  max_output_tokens: 1024
  timeout_seconds: 180
  max_retries: 1

# ─── Embedding ────────────────────────────────────────────────────────────────
embedding:
  framework: langchain
  # Local HuggingFace BGE — offline default, zero API cost. Embeddings are
  # local-only: cloud options were removed, and ollama / llama.cpp are
  # LLM-only — never embedding providers.
  provider: onnx
  model: BAAI/bge-small-en-v1.5
  # 384 dimensions matches Qdrant collection configuration via Matryoshka embeddings.
  output_dimensionality: 384
  # Max sequence length for the embedding model (BGE-small supports 512)
  max_seq_length: 512
  # Increment this version when you change the embedding model.
  version: "1"
  # Embedding Quantization (Phase 4.2) - Int8 quantized embeddings for RAM savings
  quantization: false          # Enable int8 quantization (~500-1000MB RAM savings)
  quantized_model_path: ""     # Path to pre-quantized model (auto-quantize if empty)

# ─── Verification LLM ─────────────────────────────────────────────────────────
# Used for claim-level NLI/structured verification.
verification:
  framework: langchain
  provider: llama_cpp
  model: LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
  # Per-provider yaml defaults (used when the env override is empty).
  model_ollama: gemma3:1b
  model_llamacpp: LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
  model_mlx: mlx-community/Llama-3.2-1B-Instruct-4bit
  # NVIDIA NIM verification model (same verified-live default as llm.model_nvidia)
  model_nvidia: openai/gpt-oss-20b
  temperature: 0.0          # Zero temperature for deterministic verification
  max_output_tokens: 512
  timeout_seconds: 180
  max_retries: 1
  # Circuit breaker: maximum time allowed for verification node execution
  max_verification_time_seconds: 180
  # Fused decompose+verify: one structured call instead of decompose → batch.
  # Falls back to two-step automatically on total failure. Disable with
  # FUSED_DECOMPOSE_VERIFY=0 to restore the classic path unconditionally.
  fused_decompose_verify: true

# ─── Reranker ─────────────────────────────────────────────────────────────────
reranker:
  enabled: true             # Enabled by default for production quality
  provider: cross_encoder   # cross-encoder via sentence-transformers (free)
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Max candidates scored per query (cost bound). MUST stay >= fusion_top_k:
  # capping below the fused width discards candidates before scoring.
  # NOTE: sentence-transformers ships in the `local-models` extra, NOT the
  # torch-free Docker runtime — enabling in Docker is a silent no-op
  # (get_reranker returns None → RRF order) until the image carries torch.
  top_k: 20
  # Batch size for CrossEncoder inference (CPU: 16, GPU: 64)
  batch_size: 16
  # Early termination confidence threshold
  early_termination_confidence: 0.85
  # Early termination score gap threshold
  score_gap_threshold: 0.15
  # ONNX quantization for reranker (int8 for 3-4x CPU speedup, torch-free)
  use_onnx: true
  onnx_model_path: ""  # Auto-generated if empty
  # Result cache size for reranker (Phase 3.2) - avoids re-scoring same query-doc pairs
  cache_size: 500

# ─── Retrieval ────────────────────────────────────────────────────────────────
retrieval:
  dense_top_k: 20
  sparse_top_k: 0          # BM25 via Qdrant sparse vectors
  fusion_method: rrf        # Reciprocal Rank Fusion
  rrf_k: 60                 # RRF constant (standard default)
  fusion_top_k: 20
  max_context_chunks: 8     # Maximum evidence chunks sent to LLM
  # Deterministic query router (no LLM call): simple → 1 call; temporal → 1 call +
  # reference_time; comparison/complex → bounded parallel fan-out merged by RRF.
  query_router:
    enabled: true
    max_sub_queries: 3      # Fan-out ceiling per retrieval round (≤2× base for comparisons)
  # BM25-style client TF for the sparse leg (Qdrant applies IDF server-side
  # via the Modifier.IDF sparse config — see app/db/qdrant.py). Standard defaults.
  sparse_k1: 1.2             # Term-frequency saturation
  sparse_b: 0.75             # Length-normalization strength
  sparse_avg_len_tokens: 128 # Reference length ≈ default 512-char chunk

# ─── Document Processing ──────────────────────────────────────────────────────
ingestion:
  chunk_size: 512           # Characters per chunk (approx. 128 tokens)
  chunk_overlap: 64         # Windows snap to word boundaries (see chunker.py)
  # Chunking strategy: sliding_window (default), semantic, progressive, layout_aware.
  # Non-default strategies change chunk boundaries → re-index KBs after switching.
  chunking_strategy: sliding_window
  # Supported document formats
  supported_formats:
    - pdf
    - txt
    - md
    - docx
    - csv
    - json
    - html
    - htm
  max_file_size_mb: 20
  # Maximum file size for processing (deny-of-wallet defense)
  max_total_tokens_per_doc: 200000
  # OCR fallback (RapidOCR-ONNX): native extraction stays the default; only
  # pages with less than min_native_chars of native text are OCR-rendered.
  # Page text below min_confidence is dropped (never becomes evidence).
  ocr:
    enabled: true
    engine: rapidocr-onnx
    min_native_chars: 50
    dpi: 200
    min_confidence: 0.5
    # Persist the exact page renders the OCR engine read (Phase 7 chain:
    # Answer → chunk → page → image). Native pages render nothing (no cost);
    # scanned pages cost ~1 PNG per page on disk at ingest only.
    store_page_images: true

# ─── Reliability Engine ───────────────────────────────────────────────────────
# These are engineering defaults — NOT calibrated probabilities.
# Do not present score as a probability unless calibration is performed.
reliability:
  minimum_evidence_coverage: 0.80   # Fraction of claims needing support
  maximum_contradiction_rate: 0.20  # Max fraction of contradicted claims
  abstain_below: 0.50               # Reliability score below which to abstain
  # NOTE: composite weights removed in Phase 5 — compute_verdict uses
  # coverage/contradiction only; untuned weights were a tuning trap.

# ─── Recovery Policy ──────────────────────────────────────────────────────────
recovery:
  max_recovery_attempts: 2          # Allow up to 2-3 recovery attempts
  max_recovery_tokens: 2000         # Token budget across all recovery rounds
  max_recovery_latency_seconds: 180 # Latency budget across all recovery rounds
  # Strategy costs (relative units) — prefer cheaper strategies first
  # Fallback for undiagnosed failures; diagnosed failures map directly to strategy
  strategy_priority:
    - query_rewrite
    - re_retrieve
    - regenerate

# ─── Observability (Phase 10) ───────────────────────────────────────────────
observability:
  metrics_enabled: true             # GET /api/v1/metrics Prometheus exposition
  pre_request_budget_enforcement: true  # Reject over-budget queries with 422

# ─── Context & Cost Controls ──────────────────────────────────────────────────
cost_controls:
  max_input_tokens: 100000          # Hard limit per LLM call AND pre-request query budget
  max_verification_claims: 8        # Small models choke on 20; 8 keeps NLI focused
  max_individual_nli_fallback: 8    # Must cover max_verification_claims (8): when
                                    # batch NLI fails, every claim is still attempted
                                    # individually instead of auto-NEUTRAL trailing
                                    # claims that were never even tried.
  max_claim_retrievals: 3             # Targeted-retrieval budget: at most this many
                                        # NEUTRAL claims get one extra retrieval + NLI each
  claim_retrieval_top_k: 5            # Candidate depth per targeted claim retrieval
  enable_response_caching: true     # Semantic response caching enabled
  # Per-tier caps (provider-aware override in graph.py/verifier.py)
  # Lean 8GB: local models only
  lean_tier:
    max_verification_claims: 5
    max_context_chunks: 5
    max_claim_retrievals: 2
  # Balanced 16GB: local models with more headroom
  balanced_tier:
    max_verification_claims: 8
    max_context_chunks: 8
    max_claim_retrievals: 3
  # Quality / cloud: full caps
  cloud_tier:
    max_verification_claims: 8
    max_context_chunks: 8
    max_claim_retrievals: 3

# ─── Inference Acceleration & KV Cache Optimization ───────────────────────────
optimization:
  kv_cache_quantization: "q8_0"                 # q8_0 (measured default) | q4_0 | q4_1 — honored by scripts/start_local_llm.sh (unknown values fall back to q8_0; "fp16" is not a valid llama-server k-quant)
  flash_attention: true                         # Computes attention in SRAM tiles (O(N) memory)
  prompt_caching: true                          # Reuses KV cache for static system prompt prefixes
  adaptive_top_k: true                          # Caps fused candidates at 4 on high RRF confidence (>= 0.02)
  # Context Compression (Phase 2.4) — hierarchical summarization before LLM call
  context_compression_enabled: true             # Enable/disable context compression globally
  context_compression_provider: "cloud"         # "cloud" | "local" | "off" — compression only for cloud providers (gemini, nvidia)
  context_compression_target_reduction: 0.5     # Target: 50% of original size (40-60% range)
  max_context_tokens: 8000                      # Hard token budget for context before LLM call

# ─── Local LLM Inference Parameters ────────────────────────────────────────────
# Applied to Ollama, llama.cpp, and MLX clients
local_llm:
  # Context window size (tokens). Must match or be <= llama-server -c / Ollama num_ctx
  num_ctx: 4096
  # Prompt processing batch size for llama.cpp (controls KV cache build parallelism)
  num_batch: 512
  # Release GPU memory after this idle period (Ollama: keep_alive; llama.cpp: auto-unload)
  keep_alive: "5m"
  # Speculative Decoding / Early Exit (Phase 2.5)
  # Min-p sampling: only tokens with p >= min_p * p_max are considered
  # 0.0 = disabled, 0.1 = aggressive filtering for speed
  min_p: 0.0
  # Top-k sampling: restrict to top K tokens. 0 = disabled (no limit)
  top_k: 0
  # Early stop on EOS token (n_predict streaming with early termination)
  early_exit_eos: true
  # Model Offloading (Phase 4.1) - Unload inactive models from memory
  # Ollama: POST /api/generate with keep_alive=0 (never /api/delete: it erases the blob)
  # llama.cpp: auto-unload on idle (keep_alive) or restart server with new model
  model_unload_enabled: true
  model_unload_timeout: "5m"  # Time before considering a model idle for unloading
  max_loaded_models: 1        # Max concurrent models in memory (1 for lowest RAM)