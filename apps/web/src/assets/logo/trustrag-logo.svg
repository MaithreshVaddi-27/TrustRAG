<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TrustRAG">
  <title>TrustRAG — the verdict</title>
  <!--
    A verification seal. The outer form is a rounded square — the boundary
    of a verified claim. Inside, a checkmark is formed by two converging
    evidence streams (sparse lexical on the left, dense semantic on the right)
    meeting at the verdict point. The checkmark's tail breaks past the seal's
    bottom edge: a verified claim escapes its evidence boundary instead of
    being contained by it. Silver carries the structure; crimson is the verdict.
  -->
  <rect x="28" y="28" width="200" height="200" rx="48" fill="none" stroke="#f7f7f6" stroke-width="6" />
  <path d="M 72 132 L 112 172 L 184 92" fill="none" stroke="#d41514" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="184" cy="92" r="6" fill="#d41514" />
</svg>
