<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Exact Website Gradient: from-primary-600 (#0284c7) to cyan-500 (#06b6d4) -->
    <linearGradient id="trustragGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Subtle specular highlight -->
    <linearGradient id="borderHighlight" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base matching Website Emblem -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="url(#trustragGrad)" filter="url(#cyberGlow)" />
  <rect x="2" y="2" width="28" height="28" rx="7.5" stroke="url(#borderHighlight)" stroke-width="1.2" />

  <!-- Crisp Crossed Swords (Exact Website Brand Motif) -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blade 1: Top-Left to Bottom-Right -->
    <line x1="8" y1="8" x2="21" y2="21" />
    <!-- Guard & Hilt 1 -->
    <line x1="19" y1="23" x2="23" y2="19" />
    <line x1="20" y1="20" x2="24" y2="24" />

    <!-- Blade 2: Top-Right to Bottom-Left -->
    <line x1="24" y1="8" x2="11" y2="21" />
    <!-- Guard & Hilt 2 -->
    <line x1="9" y1="19" x2="13" y2="23" />
    <line x1="12" y1="20" x2="8" y2="24" />
  </g>

  <!-- Center Reliability Core Spark -->
  <circle cx="16" cy="14.5" r="1.2" fill="#38bdf8" />
</svg>
