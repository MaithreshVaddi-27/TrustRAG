<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Obsidian foundation -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#050b14" />
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" stroke="#cdcbcA" stroke-opacity="0.34" stroke-width="1" />

  <!-- The seal — the claim's evidence boundary. -->
  <rect x="5" y="5" width="22" height="22" rx="6" stroke="#cdcbcA" stroke-width="1.5" fill="none" />

  <!-- The checkmark — two converging evidence streams meeting at the verdict. -->
  <path
    d="M 10 16.5 L 14 20.5 L 22 11.5"
    stroke="#d41514"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Verdict point. -->
  <circle cx="22" cy="11.5" r="1.2" fill="#d41514" />
</svg>
